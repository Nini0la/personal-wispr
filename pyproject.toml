[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "personal-wispr"
version = "0.1.0"
description = "System-wide push-to-talk AI dictation utility."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Personal Wispr" }]
dependencies = [
  "azure-identity>=1.17.1",
  "numpy>=1.26.4",
  "openai>=1.84.0",
  "pyautogui>=0.9.54",
  "pynput>=1.7.7",
  "pyobjc-framework-AppKit>=10.3.1; platform_system == 'Darwin'",
  "pyperclip>=1.9.0",
  "python-dotenv>=1.0.1",
  "sounddevice>=0.5.1",
  "soundfile>=0.12.1",
]

[project.scripts]
wispr-dictate = "src.main:main"

[tool.uv]
dev-dependencies = []
